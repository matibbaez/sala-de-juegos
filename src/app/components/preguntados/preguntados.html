<div class="max-w-6xl mx-auto mt-10 p-6 font-sans">
  
  <div class="flex flex-col md:flex-row justify-between items-center bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl mb-10 gap-4 md:gap-0">
    <div class="text-center md:text-left">
      <h1 class="text-3xl font-black text-white tracking-tight uppercase">Preguntados</h1>
      <p class="text-gray-400 mt-1">Conectado a la base de datos global de RestCountries</p>
    </div>
    <button (click)="volverAlHome()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 px-6 py-2.5 rounded-lg text-sm font-bold transition-colors w-full md:w-auto shadow-md">
      Volver al Inicio
    </button>
  </div>

  <div *ngIf="cargandoAPI" class="max-w-3xl mx-auto bg-gray-900 p-16 rounded-3xl border border-gray-700 shadow-2xl flex flex-col items-center justify-center">
    <svg class="animate-spin h-12 w-12 text-blue-500 mb-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <p class="text-gray-400 font-bold tracking-widest uppercase">Descargando datos...</p>
  </div>

  <div *ngIf="!cargandoAPI && !juegoTerminado && paisActual" class="max-w-3xl mx-auto bg-gray-900 p-8 rounded-3xl border border-gray-700 shadow-2xl">
    
    <div class="flex justify-between items-center mb-8 px-2 border-b border-gray-800 pb-4">
      <span class="text-sm text-gray-500 uppercase tracking-widest font-bold">Adiviná la bandera</span>
      <div class="bg-blue-900/30 border border-blue-800 px-4 py-1.5 rounded-lg transition-transform" [ngClass]="{'scale-110': mostrandoRespuesta && opcionSeleccionada?.nombre === paisActual.nombre}">
        <span class="text-xs text-blue-400 uppercase tracking-widest font-bold mr-2">Racha:</span>
        <span class="text-xl font-black text-white">{{ puntaje }}</span>
      </div>
    </div>

    <div class="flex justify-center mb-10">
      <div class="relative w-64 h-40 md:w-80 md:h-48 rounded-xl overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.5)] border border-gray-700">
        <img [src]="paisActual.bandera" alt="Bandera secreta" class="w-full h-full object-cover">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <button *ngFor="let opcion of opciones" 
              (click)="evaluarRespuesta(opcion)"
              [disabled]="mostrandoRespuesta"
              class="font-bold py-5 px-6 rounded-xl border transition-all shadow-md text-lg truncate flex items-center justify-center gap-3"
              [ngClass]="{
                'bg-gray-800 text-gray-200 border-gray-700 hover:border-blue-500 hover:bg-gray-700 active:scale-95': !mostrandoRespuesta,
                'bg-green-600 text-white border-green-500 shadow-lg shadow-green-500/20 scale-105 z-10': mostrandoRespuesta && opcion.nombre === paisActual.nombre,
                'bg-red-600 text-white border-red-500 shadow-lg shadow-red-500/20': mostrandoRespuesta && opcion.nombre === opcionSeleccionada?.nombre && opcion.nombre !== paisActual.nombre,
                'bg-gray-800 text-gray-600 border-gray-800 opacity-50': mostrandoRespuesta && opcion.nombre !== paisActual.nombre && opcion.nombre !== opcionSeleccionada?.nombre
              }">
        
        <svg *ngIf="mostrandoRespuesta && opcion.nombre === paisActual.nombre" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        <svg *ngIf="mostrandoRespuesta && opcion.nombre === opcionSeleccionada?.nombre && opcion.nombre !== paisActual.nombre" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
        
        {{ opcion.nombre }}
      </button>
    </div>
  </div>

  <div *ngIf="juegoTerminado" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
    <div class="bg-gray-900 p-10 rounded-3xl shadow-2xl border border-gray-700 max-w-md w-full text-center">
      
      <div class="mb-6 flex justify-center">
        <div class="bg-red-900/30 p-5 rounded-full border border-red-800">
          <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
      </div>

      <h3 class="text-4xl font-black mb-2 text-white tracking-tight">¡PERDISTE!</h3>
      <p class="text-gray-400 text-sm mb-8 px-4">{{ mensajeFinal }}</p>
      
      <div class="bg-gray-950 rounded-2xl p-6 mb-8 border border-gray-800 shadow-inner">
        <p class="text-xs uppercase tracking-widest text-gray-500 mb-1 font-bold">Países Acertados</p>
        <p class="text-6xl font-black text-blue-400">{{ puntaje }}</p>
      </div>

      <button (click)="iniciarJuego()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-xl transition-all w-full text-lg shadow-lg hover:shadow-blue-500/20 active:scale-95 uppercase tracking-widest">
        Volver a Jugar
      </button>
    </div>
  </div>

</div>
