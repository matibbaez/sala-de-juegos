<div class="max-w-6xl mx-auto mt-10 p-4 md:p-6 font-sans">
  
  <div class="flex flex-col md:flex-row justify-between items-center bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl mb-6 md:mb-10 gap-4 md:gap-0">
    <div class="text-center md:text-left">
      <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight uppercase">Reflejos en la Red</h1>
      <p class="text-xs md:text-sm text-gray-400 mt-1">Impactá la pelota antes de que se pase de largo</p>
    </div>
    <button (click)="volverAlHome()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 px-6 py-2.5 rounded-lg text-sm font-bold transition-colors w-full md:w-auto shadow-md">
      Volver al Inicio
    </button>
  </div>

  <div class="max-w-4xl mx-auto bg-gray-900 p-4 md:p-8 rounded-3xl border border-gray-700 shadow-2xl relative">
    
    <div class="grid grid-cols-4 bg-gray-950 rounded-xl p-3 md:p-4 mb-6 border border-gray-800 shadow-inner divide-x divide-gray-800">
      
      <div class="flex flex-col items-center justify-center px-1">
        <span class="text-[9px] md:text-xs text-gray-500 uppercase tracking-widest font-bold mb-1">Puntos</span>
        <span class="text-xl md:text-3xl font-black text-blue-400">{{ puntaje }}</span>
      </div>
      
      <div class="flex flex-col items-center justify-center px-1">
        <span class="text-[9px] md:text-xs text-gray-500 uppercase tracking-widest font-bold mb-1">Vidas</span>
        <div class="flex gap-0.5 md:gap-2 mt-1" [ngClass]="{'animate-bounce': mostrarFallo}">
          <svg *ngFor="let v of [1,2,3]" class="w-4 h-4 md:w-6 md:h-6 transition-colors duration-300" [ngClass]="v <= vidas ? 'text-red-500' : 'text-gray-700'" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>
      
      <div class="flex flex-col items-center justify-center px-1">
        <span class="text-[9px] md:text-xs text-gray-500 uppercase tracking-widest font-bold mb-1">Velocidad</span>
        <span class="text-sm md:text-xl font-bold text-gray-300">{{ tiempoReaccionLimite }}ms</span>
      </div>
      
      <div class="flex flex-col items-center justify-center px-1">
        <span class="text-[9px] md:text-xs text-gray-500 uppercase tracking-widest font-bold mb-1">Tiempo</span>
        <span class="text-sm md:text-xl font-bold text-gray-300">{{ tiempoTranscurrido }}s</span>
      </div>
    </div>

    <div class="relative w-full h-80 md:h-[400px] border-4 rounded-xl overflow-hidden shadow-inner cursor-crosshair group transition-colors duration-300"
         [ngClass]="mostrarFallo ? 'bg-red-950/40 border-red-600' : 'bg-[#1e293b] border-gray-600'"
         (click)="clicEnCancha()">
      
      <div *ngIf="juegoActivo && !mostrarFallo" class="absolute top-0 left-0 right-0 h-1.5 bg-gray-800 z-30">
        <div class="h-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)]"
             [style.width.%]="porcentajeTiempo"
             [style.transition]="porcentajeTiempo === 100 ? 'none' : 'width ' + tiempoReaccionLimite + 'ms linear'">
        </div>
      </div>

      <div class="absolute top-1/2 left-0 right-0 h-1 bg-gray-500/30 transform -translate-y-1/2"></div>
      <div class="absolute top-0 bottom-0 left-1/2 w-1 bg-gray-500/30 transform -translate-x-1/2"></div>
      
      <div *ngIf="!juegoActivo && !juegoTerminado" class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm flex flex-col items-center justify-center z-20">
        <svg class="w-12 h-12 md:w-16 md:h-16 text-blue-500 mb-4 md:mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        <button (click)="iniciarJuego($event)" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-lg md:text-xl py-3 px-8 md:py-4 md:px-10 rounded-xl shadow-lg hover:shadow-blue-500/20 active:scale-95 transition-all uppercase tracking-widest">
          Empezar
        </button>
      </div>

      <div *ngIf="mostrarFallo" class="absolute inset-0 flex flex-col items-center justify-center z-30 animate-pulse bg-red-600/20 backdrop-blur-sm">
        <svg class="w-16 h-16 md:w-20 md:h-20 text-red-500 drop-shadow-2xl mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
        <span class="text-3xl md:text-4xl font-black text-white uppercase tracking-widest drop-shadow-2xl">¡Fallo!</span>
      </div>

      <div *ngIf="juegoActivo && pelotaActiva && !mostrarFallo" 
           (mousedown)="impactarPelota($event)"
           class="absolute w-12 h-12 md:w-14 md:h-14 bg-[#bfff00] rounded-full shadow-[0_0_20px_rgba(191,255,0,0.4)] cursor-pointer border-2 border-[#8cc600] flex items-center justify-center transform hover:scale-110 active:scale-90 transition-transform duration-75 z-10"
           [style.left.%]="posicionX" 
           [style.top.%]="posicionY">
           <svg class="w-6 h-6 md:w-8 md:h-8 text-[#8cc600] opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12a7 7 0 0 0 14 0" stroke-linecap="round"/></svg>
      </div>

    </div>
  </div>

  <div *ngIf="juegoTerminado" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4 transition-opacity duration-300">
    <div class="bg-gray-900 p-8 md:p-10 rounded-3xl shadow-2xl border border-gray-700 max-w-md w-full text-center">
      
      <div class="mb-6 flex justify-center">
        <div class="bg-gray-800 p-4 md:p-5 rounded-full border border-gray-600">
          <svg class="w-12 h-12 md:w-16 md:h-16 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
      </div>

      <h3 class="text-3xl md:text-4xl font-black mb-2 text-white tracking-tight">FIN DEL JUEGO</h3>
      <p class="text-gray-400 text-xs md:text-sm mb-8 px-2 md:px-4">{{ mensajeFinal }}</p>
      
      <div class="grid grid-cols-2 gap-4 bg-gray-950 rounded-2xl p-4 md:p-6 mb-8 border border-gray-800 shadow-inner">
        <div class="border-r border-gray-800">
          <p class="text-[10px] md:text-xs uppercase tracking-widest text-gray-500 mb-1 font-bold">Tiempo</p>
          <p class="text-2xl md:text-3xl font-bold text-gray-300">{{ tiempoTranscurrido }}s</p>
        </div>
        <div>
          <p class="text-[10px] md:text-xs uppercase tracking-widest text-gray-500 mb-1 font-bold">Puntaje</p>
          <p class="text-3xl md:text-4xl font-black text-blue-400">{{ puntaje }}</p>
        </div>
      </div>

      <button (click)="iniciarJuego($event)" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 md:py-4 px-8 rounded-xl transition-all w-full text-base md:text-lg shadow-lg hover:shadow-blue-500/20 active:scale-95 uppercase tracking-widest">
        Jugar de Nuevo
      </button>
    </div>
  </div>

</div>
