<div class="flex flex-col items-center justify-center flex-1 w-full max-w-4xl mx-auto mt-10 md:mt-20">
  
  <div class="bg-slate-900 p-10 md:p-16 rounded-sm shadow-xl border border-gray-800 w-full text-center">
    
    <svg class="mx-auto h-16 w-16 text-red-500 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    
    <h1 *ngIf="usuarioLogueado" class="text-3xl font-extrabold text-white mb-2 uppercase tracking-wide">
      Bienvenido a la Sala de Juegos
    </h1>
    <h1 *ngIf="!usuarioLogueado" class="text-3xl font-extrabold text-white mb-2 uppercase tracking-wide">
      Panel Principal
    </h1>
    
    <p *ngIf="usuarioLogueado" class="text-red-400 font-medium mb-8">{{ usuarioLogueado.email }}</p>
    
    <p class="text-slate-400 mb-8 max-w-lg mx-auto">La interfaz de juegos y las estadísticas de cada jugador estarán disponibles a partir del Sprint 2.</p>
    
    <div *ngIf="!usuarioLogueado" class="flex justify-center gap-4 mb-8">
      <a routerLink="/login" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded-sm transition-colors border border-gray-700 uppercase text-sm tracking-wide">Ingresar</a>
    </div>

    <div class="h-1 w-20 bg-red-600 mx-auto rounded-full"></div>
  </div>
</div>
