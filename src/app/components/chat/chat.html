<div class="max-w-4xl mx-auto mt-8 bg-gray-900 rounded-2xl shadow-2xl overflow-hidden border border-gray-700 flex flex-col h-162.5 font-sans">
  
  <div class="bg-gray-950 p-5 border-b border-gray-800 flex items-center justify-between shadow-sm z-10 flex-wrap gap-4">
    <div class="flex items-center gap-3">
      <div class="relative flex h-4 w-4">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-4 w-4 bg-green-500"></span>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white tracking-wide">Sala de Jugadores</h2>
        <p class="text-xs text-gray-400">Chat global en vivo</p>
      </div>
    </div>
    
    <a routerLink="/home" class="bg-gray-900 hover:bg-gray-800 text-gray-300 border border-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-md">
      Volver al Inicio
    </a>
  </div>

  <div #contenedorMensajes class="flex-1 overflow-y-auto p-6 space-y-6 bg-linear-to-b from-gray-900 to-gray-800 custom-scrollbar">
    <div *ngFor="let msg of mensajes" 
         class="flex items-end gap-3 fade-in-up" 
         [ngClass]="{'flex-row-reverse': msg.usuario_id === usuarioActual?.user?.id}">
      
      <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm shadow-lg border-2 shrink-0"
           [ngClass]="msg.usuario_id === usuarioActual?.user?.id ? 'bg-blue-600 border-blue-400 text-white' : 'bg-gray-700 border-gray-500 text-gray-200'">
        {{ msg.nombre_usuario?.substring(0, 1) | uppercase }}
      </div>

      <div class="flex flex-col max-w-[70%]" [ngClass]="{'items-end': msg.usuario_id === usuarioActual?.user?.id}">
        <span class="text-xs text-gray-400 mb-1 px-1 font-medium">
          {{ msg.usuario_id === usuarioActual?.user?.id ? 'Yo' : msg.nombre_usuario }}
        </span>
        
        <div class="px-5 py-3 shadow-lg text-sm md:text-base wrap-break-word"
             [ngClass]="msg.usuario_id === usuarioActual?.user?.id ? 'bg-blue-600 text-white rounded-2xl rounded-br-sm' : 'bg-gray-800 text-gray-100 rounded-2xl rounded-bl-sm border border-gray-700'">
          {{ msg.mensaje }}
        </div>
        
        <span class="text-[10px] text-gray-500 mt-1 px-1">
          {{ msg.creado_en | date:'HH:mm' }}
        </span>
      </div>
    </div>
  </div>

  <div class="bg-gray-950 p-4 border-t border-gray-800">
    <form (ngSubmit)="enviar()" class="flex gap-3 relative">
      <input type="text" 
             [(ngModel)]="nuevoMensaje" 
             name="mensaje"
             autocomplete="off"
             placeholder="Escribí tu mensaje acá..." 
             class="flex-1 bg-gray-900 text-gray-100 border border-gray-700 rounded-full pl-6 pr-16 py-4 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all shadow-inner"
             [disabled]="enviando">
      
      <button type="submit" 
              [disabled]="!nuevoMensaje.trim() || enviando"
              class="absolute right-2 top-2 bottom-2 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-500 text-white rounded-full p-2 transition-all flex items-center justify-center w-12 shadow-md">
        <svg *ngIf="!enviando" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 ml-1">
          <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
        </svg>
        <span *ngIf="enviando" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      </button>
    </form>
  </div>
</div>
